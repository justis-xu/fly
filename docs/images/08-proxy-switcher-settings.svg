<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
<title id="title">Proxy Switcher 参数填写示意</title><desc id="desc">新建名为 fly 的代理配置，协议 HTTP，主机 127.0.0.1，端口 7888，用户名密码留空，保存并启用。</desc>
<rect width="960" height="590" rx="20" fill="#f5f8fc"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#25334b">
<text x="40" y="48" font-size="24" font-weight="600">在 Proxy Switcher 中新增一个代理配置</text>
<text x="40" y="78" font-size="14" fill="#738198">参数填写示意，不是插件截图；不同版本的按钮名称可能不同。</text>
<rect x="40" y="103" width="880" height="327" rx="14" fill="white" stroke="#d9e5f5"/>
<g font-size="18"><text x="68" y="145">配置名称</text><text x="325" y="145" font-weight="600">fly（自己起的名字）</text>
<text x="68" y="200">代理协议</text><text x="325" y="200" font-weight="600" fill="#3568df">HTTP</text>
<text x="68" y="255">代理主机 / 服务器地址</text><text x="325" y="255" font-family="monospace" font-weight="600">127.0.0.1</text>
<text x="68" y="310">代理端口</text><text x="325" y="310" font-family="monospace" font-weight="600" fill="#3568df">7888</text>
<text x="68" y="365">用户名 / 密码</text><text x="325" y="365" font-weight="600">留空</text>
<text x="68" y="405" font-size="14" fill="#738198">HTTPS 网站也使用上面的 HTTP 代理；可选择 SOCKS5，主机、端口相同。</text></g>
<g stroke="#edf2f8"><path d="M65 166H895M65 221H895M65 276H895M65 331H895M65 383H895"/></g>
<rect x="40" y="453" width="880" height="95" rx="12" fill="#eaf2ff"/>
<text x="64" y="484" font-size="18" font-weight="600" fill="#315ba6">保存配置后，还要在插件中选中并启用 fly。</text>
<text x="64" y="512" font-size="15" fill="#315ba6">如果插件按网站分流，确认你要访问的网站已选为使用 fly。</text>
<text x="64" y="535" font-size="14" fill="#315ba6">不要填写管理网页端口 7889；停止 fly 前，先将插件切回直连。</text>
</g></svg>
