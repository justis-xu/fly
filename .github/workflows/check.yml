name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci --no-fund --no-audit
        working-directory: web
      - run: npm test && npm run build && npm run typecheck
        working-directory: web
      - name: Check shipped UI is current
        run: node web/scripts/verify-export.mjs
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o fly .
      - name: Clean-room install and runtime acceptance
        run: python3 scripts/acceptance/clean_room.py --binary ./fly --install
