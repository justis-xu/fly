<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fly · 本地代理</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#202b3a;--muted:#7a8492;--line:#e7ebef;--blue:#3568df;--green:#238565}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,summary:focus-visible{outline:3px solid #a8c3ff;outline-offset:3px}.wrap{max-width:1060px;margin:auto;padding:36px 28px 32px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;gap:12px;align-items:center}.mark{background:var(--blue);color:white;border-radius:12px;width:38px;height:38px;display:grid;place-items:center;font-size:22px}.brand strong{font-size:24px;letter-spacing:-1px}.brand small{color:var(--muted);margin-left:10px}.status{font-size:12px;color:var(--green);display:flex;gap:7px;align-items:center}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.connection{padding:25px 28px;margin-bottom:22px;display:flex;gap:20px;align-items:center;justify-content:space-between}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:5px}h1{font-size:23px;line-height:1.4;margin:0;letter-spacing:-.5px;font-weight:600;overflow-wrap:anywhere}.secondary{color:var(--muted);font-size:12px;margin-top:6px}.endpoint{border-left:1px solid var(--line);padding-left:28px;flex-shrink:0}code{font:14px ui-monospace,SFMono-Regular,monospace}.endpoint code{font-size:16px;font-weight:500}.copy{background:none;border:0;color:var(--blue);margin-left:8px;font-size:12px;padding:6px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}.nodes-section{padding:23px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}h2{font-size:15px;margin:0;font-weight:600}.count{color:var(--muted);font-size:12px;font-weight:400;margin-left:6px}.button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:white;font-size:12px}.button:hover{border-color:#b7c9ed;background:#f9fbff}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.primary:hover{background:#2855c1;color:white}.search,input[type=url]{width:100%;border:1px solid var(--line);border-radius:9px;background:#fafbfd;padding:10px 12px;color:var(--ink);outline:none}.search:focus,input:focus{border-color:#8baaf1}.search{margin-bottom:14px}#nodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.node{display:flex;text-align:left;align-items:center;gap:9px;padding:13px 12px;background:white;border:1px solid var(--line);border-radius:10px;min-width:0;color:var(--ink)}.node:hover{border-color:#adc2ed}.node.active{background:#f0f5ff;border-color:#7b9ee9}.radio{width:14px;height:14px;border:1.5px solid #cdd4df;border-radius:50%;flex-shrink:0}.active .radio{border:4px solid var(--blue)}.node-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:12px}.delay{font-size:10px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}.delay.good{color:var(--green)}.delay.slow{color:#b68128}.auto{grid-column:1/-1}.sidebar{display:flex;flex-direction:column;gap:18px;align-self:start}.sidebar .card{padding:22px}.row{display:flex;justify-content:space-between;gap:12px;margin:12px 0;font-size:12px}.row span:first-child{color:var(--muted)}progress{width:100%;height:5px;border:0;border-radius:5px;overflow:hidden;accent-color:var(--blue)}progress::-webkit-progress-bar{background:#edf0f5}progress::-webkit-progress-value{background:var(--blue)}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}details{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}summary{cursor:pointer;font-size:12px;color:var(--muted)}label{display:block;margin:14px 0 6px;font-size:12px}#sub-save{margin-top:10px;width:100%}.note{font-size:12px;color:var(--muted);line-height:1.8}.notice{border:1px solid #f0d3b4;background:#fff7ec;color:#95612b;border-radius:10px;padding:11px 16px;margin-bottom:18px;font-size:12px}.notice[hidden]{display:none}.notice.info{background:#eef4ff;border-color:#d7e4ff;color:#3560a3}#rule-list{margin-top:12px;max-height:220px;overflow:auto;font-size:11px}.rule{padding:7px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.rule b{font-weight:500}.empty{grid-column:1/-1;color:var(--muted);padding:28px;text-align:center;font-size:13px}footer{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;margin-top:25px}#edit-sub input{font-size:12px}.hint{font-size:11px;color:var(--muted);margin-top:8px}@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}.connection{padding:22px}header{margin-bottom:20px}}@media(max-width:560px){.wrap{padding:22px 16px}.brand small{display:none}.connection{align-items:stretch;flex-direction:column;gap:18px}.endpoint{border-left:0;border-top:1px solid var(--line);padding:15px 0 0}.sidebar{display:flex}#nodes{grid-template-columns:1fr}.nodes-section{padding:18px}h1{font-size:20px}footer{flex-direction:column}}
</style>
</head>
<body><main class="wrap">
<header><div class="brand"><span class="mark" aria-hidden="true">↗</span><div><strong>fly</strong><small>本地代理服务器</small></div></div><span class="status" id="status" role="status">正在连接</span></header>
<div class="notice" id="notice" role="status" hidden></div>
<section class="card connection"><div><div class="eyebrow">当前使用</div><h1 id="current">正在加载…</h1><div class="secondary" id="current-detail">订阅分流自动生效</div></div><div class="endpoint"><div class="eyebrow">Proxy Switcher · HTTP / SOCKS5</div><code id="proxy-addr">—</code><button class="copy" id="copy" aria-label="复制代理地址">复制</button><div class="secondary">在 Proxy Switcher 中填写此地址</div></div></section>
<div class="layout"><section class="card nodes-section"><div class="section-title"><h2>选择节点 <span class="count" id="count"></span></h2><button class="button" id="test" disabled>测速</button></div><input class="search" id="search" type="search" placeholder="搜索节点名称…" aria-label="搜索节点"><div id="nodes"><div class="empty">正在加载节点…</div></div></section>
<aside class="sidebar"><section class="card"><h2>订阅</h2><div class="row"><span>订阅来源</span><span id="source">—</span></div><div class="row"><span>已用 / 总流量</span><span id="traffic">—</span></div><progress id="usage" max="100" value="0" aria-label="订阅流量使用比例" hidden></progress><div class="row"><span>到期时间</span><span id="expiry">—</span></div><div class="row"><span>最近更新</span><span id="updated">—</span></div><div class="actions"><button class="button" id="update">更新订阅</button></div><details id="edit-sub"><summary>修改订阅地址</summary><form id="sub-form"><label for="sub-url">订阅地址</label><input id="sub-url" type="url" required autocomplete="off" spellcheck="false" placeholder="https://…"><button class="button primary" id="sub-save" type="submit">保存并更新</button></form></details></section>
<section class="card"><h2>自动分流</h2><p class="note" id="rules-summary">正在读取订阅规则…</p><details id="rule-details"><summary>查看规则详情</summary><div id="rule-list"></div></details></section></aside></div>
<footer><span id="admin">管理网页 —</span><span>仅本机访问 · 由命令行启停</span></footer>
</main>
<script>
const GROUP='🚀 Proxy',AUTO='♻️ 自动选择';
const $=s=>document.querySelector(s);
let proxies={},group=null,info={},testing=false,switching=false,timer=null,noticeTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=n=>n===AUTO?'自动选择':n===GROUP?'所选节点':n==='DIRECT'?'直连':n;
function notice(text,error=false){clearTimeout(noticeTimer);const el=$('#notice');el.textContent=text;el.className='notice'+(error?'':' info');el.hidden=!text;}
async function api(path,options){const r=await fetch('/api/'+path,options);if(!r.ok)throw new Error(await r.text());return r.json();}
function render(){
 if(!group){$('#current').textContent=info.needs_subscription?'请先添加订阅':'代理尚未就绪';$('#current-detail').textContent='在右侧填写你自己的订阅地址';$('#nodes').innerHTML='<div class="empty">'+(info.starting?'正在加载订阅，请稍候…':'暂无可用节点，请检查订阅')+'</div>';return;}
 const query=$('#search').value.trim().toLowerCase();
 const names=group.all.filter(n=>n!=='DIRECT'&&(!query||label(n).toLowerCase().includes(query)));
 $('#nodes').innerHTML=names.map(n=>{const p=proxies[n]||{},h=p.history||[],d=h.length?h[h.length-1].delay:null;
 const delay=n===AUTO?'自动测速':testing?'测速中':d===null?'未测速':d>0?d+' ms':'超时';
 return `<button class="node ${n===group.now?'active':''} ${n===AUTO?'auto':''}" data-name="${esc(n)}" aria-pressed="${n===group.now}" ${switching?'disabled':''} title="${esc(n)}"><span class="radio" aria-hidden="true"></span><span class="node-name">${esc(label(n))}</span><span class="delay ${d>0&&d<300?'good':d>=300?'slow':''}">${delay}</span></button>`;}).join('')||'<div class="empty">没有找到匹配的节点</div>';
 $('#nodes').querySelectorAll('[data-name]').forEach(el=>el.onclick=()=>selectNode(el.dataset.name));
 $('#count').textContent=info.nodes?info.nodes+' 个':'';
 $('#current').textContent=label(group.now)||'请选择节点';
 $('#current-detail').textContent=group.now===AUTO?'自动选择 · '+(proxies[AUTO]?.now||'正在检测延迟'):'订阅分流 · 代理流量使用此节点';
}
async function selectNode(name){if(switching||name===group?.now)return;switching=true;render();try{await api('select',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});await loadProxies();}catch(e){notice('切换失败：'+e.message,true);}finally{switching=false;render();}}
async function loadProxies(){const d=await api('proxies');proxies=d.proxies||{};group=proxies[GROUP];$('#test').disabled=!group||testing;render();}
function showInfo(d){info=d;$('#proxy-addr').textContent='127.0.0.1:'+d.proxy_port;$('#admin').textContent='管理网页 http://'+d.admin_addr;
 $('#status').textContent=d.needs_subscription?'等待添加订阅':d.starting?'正在启动':d.updating?'更新订阅中':!d.ready?'代理未就绪':'服务运行中';$('#status').style.color=d.starting?'#b68128':'';
 const s=d.subscription||{};$('#traffic').textContent=s.total>0?`${(s.used/1073741824).toFixed(1)} / ${(s.total/1073741824).toFixed(1)} GB`:'订阅未提供';$('#usage').hidden=!(s.total>0);$('#usage').value=s.total>0?Math.min(100,s.used/s.total*100):0;
 $('#expiry').textContent=s.expire>0?new Date(s.expire*1000).toLocaleDateString('zh-CN'):'订阅未提供';$('#updated').textContent=s.fetched_at>0?new Date(s.fetched_at*1000).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
 $('#update').disabled=d.updating||d.starting||d.needs_subscription;$('#sub-save').disabled=d.updating||d.starting;
 if(d.update_err)notice('更新失败：'+d.update_err,true);else if(d.last_err)notice((d.ready?'订阅更新失败，继续使用上次缓存。':'订阅加载失败，请检查或修改订阅。')+d.last_err,true);else if(d.updating)notice('正在拉取订阅，请稍候…');else if(d.starting)notice('正在加载订阅和分流规则，请稍候…');else if(d.needs_subscription)notice('fly 不附带代理节点或订阅。请先填入自己的订阅，再配置 Proxy Switcher。');else notice('');
}
async function loadRules(){const d=await api('rules');const providers=d.providers||[],rules=d.rules||[],pending=providers.filter(p=>p.count===0);
 $('#rules-summary').textContent=providers.length?`使用订阅分流 · ${providers.length} 个规则集`+(pending.length?`，${pending.length} 个尚未就绪`:'，已加载'):(rules.length?'使用内置或订阅分流规则':'规则加载中…');
 $('#rule-list').innerHTML=rules.map(r=>`<div class="rule"><b>${esc(r.type)}</b> ${esc(r.payload)} → ${esc(label(r.target))}</div>`).join('')+providers.map(p=>`<div class="rule">${esc(p.name)} · ${p.count>0?p.count+' 条规则':'尚未就绪，请稍后更新订阅'}</div>`).join('');
}
async function refresh(){clearTimeout(timer);try{const d=await api('info');showInfo(d);if(!d.starting||d.current){await Promise.all([loadProxies(),loadRules()]);}else render();timer=setTimeout(refresh,d.starting||d.updating?2000:30000);}catch(e){$('#status').textContent='连接中断';$('#status').style.color='#b15d3c';notice('无法连接 fly，请在命令行运行 fly start。',true);timer=setTimeout(refresh,5000);}}
$('#search').oninput=render;
$('#test').onclick=async()=>{if(testing)return;testing=true;$('#test').disabled=true;$('#test').textContent='测速中…';render();try{const d=await api('test',{method:'POST'});for(const [n,delay] of Object.entries(d)){if(proxies[n])proxies[n].history=[{delay}];}notice(`测速完成，${Object.values(d).filter(v=>v>0).length} 个节点可用。`);}catch(e){notice('测速失败：'+e.message,true);}finally{testing=false;$('#test').disabled=false;$('#test').textContent='测速';render();}};
$('#update').onclick=async()=>{ $('#update').disabled=true;try{await api('update',{method:'POST'});await refresh();}catch(e){notice('更新失败：'+e.message,true);$('#update').disabled=false;}};
$('#sub-form').onsubmit=async e=>{e.preventDefault();const url=$('#sub-url').value.trim();if(!/^https?:\/\//i.test(url)){notice('请输入 http 或 https 订阅地址。',true);return;}$('#sub-save').disabled=true;try{await api('subscription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});$('#source').textContent=new URL(url).hostname;$('#edit-sub').open=false;await refresh();}catch(e){notice('保存失败：'+e.message,true);$('#sub-save').disabled=false;}};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#proxy-addr').textContent);$('#copy').textContent='已复制';setTimeout(()=>$('#copy').textContent='复制',1600);}catch{notice('复制失败，请手动复制代理地址。',true);}};
api('subscription').then(d=>{$('#sub-url').value=d.url;if(!d.url)$('#edit-sub').open=true;try{$('#source').textContent=new URL(d.url).hostname;}catch{$('#source').textContent='尚未设置';}}).catch(()=>{});
refresh();
</script></body></html>
